# Brings up the whole environment with a single `docker compose up`:
#   postgres (logical WAL) -> seed (one-shot) -> streamer (continuous).
# Credentials are simple, documented dev values, override via env if needed.

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: secret

services:
  postgres:
    image: postgres:16
    # Logical WAL enabled so candidates can choose CDC / logical replication.
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  seed:
    build: .
    environment:
      <<: *app-env
      SEED_USERS: ${SEED_USERS:-1000}
      SEED_ASSISTANTS: ${SEED_ASSISTANTS:-50}
      SEED_CONVERSATIONS: ${SEED_CONVERSATIONS:-5000}
      SEED_MESSAGES: ${SEED_MESSAGES:-100000}
      SEED_DAYS: ${SEED_DAYS:-90}
      SEED_FEEDBACK_RATE: ${SEED_FEEDBACK_RATE:-0.15}
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m src.seed
    restart: "no"

  streamer:
    build: .
    environment:
      <<: *app-env
      STREAM_INTERVAL: ${STREAM_INTERVAL:-2}
      STREAM_BATCH_MIN: ${STREAM_BATCH_MIN:-1}
      STREAM_BATCH_MAX: ${STREAM_BATCH_MAX:-10}
    depends_on:
      seed:
        condition: service_completed_successfully
    command: python -m src.streamer
    restart: unless-stopped

  # --- ingestion: Postgres WAL -> Debezium -> Kafka -> ClickHouse -------------

  kafka:
    image: apache/kafka:4.2.2
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      # Keep CDC topics forever so ClickHouse can replay from offset 0.
      KAFKA_LOG_RETENTION_MS: -1
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 60s

  connect:
    image: quay.io/debezium/connect:3.6.3.Final
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx768m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

  # Registers the Debezium connector. PUT is an upsert, so re-running is a no-op.
  connect-init:
    image: curlimages/curl:8.11.1
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./ingestion/debezium/pg-connector.json:/pg-connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -fsS -X PUT -H 'Content-Type: application/json' \
          --data @/pg-connector.json http://connect:8083/connectors/pg/config; do sleep 5; done

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-secret}
    volumes:
      - chdata:/var/lib/clickhouse
      - ./ingestion/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./ingestion/clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse client --password \"$$CLICKHOUSE_PASSWORD\" -q 'EXISTS TABLE raw.cdc_events' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  # --- warehouse ---------------------------------------------------

  dbt:
    build: ./warehouse
    depends_on:
      clickhouse:
        condition: service_healthy
      connect-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-secret}
      DBT_INTERVAL: ${DBT_INTERVAL:-60}
    restart: unless-stopped

  # --- dashboards --------------------------------------------------

  metabase:
    image: metabase/metabase:v0.58.35
    # Staggers JVM startups (Kafka, Connect, Metabase) so healthchecks don't time out on a laptop.
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: -Xmx1g
    volumes:
      - mbdata:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  metabase-init:
    image: python:3.12-slim
    depends_on:
      metabase:
        condition: service_healthy
    environment:
      MB_ADMIN_EMAIL: ${MB_ADMIN_EMAIL:-admin@example.com}
      MB_ADMIN_PASSWORD: ${MB_ADMIN_PASSWORD:-Metabase-admin-1}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-secret}
    volumes:
      - ./dashboards:/app:ro
    command: ["python", "/app/provision.py"]

volumes:
  pgdata:
  kafkadata:
  chdata:
  mbdata:
